
name: Test Treasury Relative Value


on:
  push:
    branches:
      - feature/relative-value-analyzer
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

jobs:
  validate-relative-value:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          python -m unittest discover -s src/tests -p "test_*.py" -v

      - name: Generate Relative Value data
        run: |
          python src/calculate_relative_value.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/relative_value.json > /dev/null
          
      - name: Publish Relative Value JSON
        if: github.ref == 'refs/heads/feature/relative-value-analyzer'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/relative_value.json

          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update Relative Value research data [skip ci]"
            git push origin HEAD:feature/relative-value-analyzer
          fi

